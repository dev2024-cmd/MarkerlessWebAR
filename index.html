<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="./aframe-ar-main/dist/aframe-ar.min.js"></script>

  <title>Document</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

</head>
<body>

<script>
  function showMessage(message){
    let hud = document.querySelector("#hud");  
    if(hud){
      hud.setAttribute('value', message);
    }
  }

  AFRAME.registerComponent('ar-logic', {
    init: function(){
      showMessage('ar-logic running');
    },

    tick : function(){
      let cam = document.querySelector("#cam");
      if(!cam || !cam.components.raycaster){ return; }

      showMessage('cam detected');

      let collision = cam.components.raycaster.getIntersection(this.el);
      if(!collision){ return; }

      showMessage(
        'Occurred collision ' + 
        collision.point.x.toFixed(2) + " " + 
        collision.point.z.toFixed(2)
      );

      let circle = document.querySelector("#circle");
      if(circle){
        circle.setAttribute('position', collision.point);
      }
    }
  });

  window.addEventListener('touchstart', function(){
    let box = document.querySelector("#box");
    let circle = document.querySelector("#circle");

    if(!box || !circle) return;

    let pos = circle.getAttribute('position');
    box.setAttribute('position', pos);
  });
</script>

<a-scene ar ar-logic>

  <a-camera 
    id="cam"
    ar-raycaster
    raycaster="objects: #circle;"  
  >
    <a-text
      id="hud"
      value="Paris"
      position="0 -0.1 -0.25"
      align="center"
      wrap-count="40"
    ></a-text>
  </a-camera>

  <a-ring 
    id="circle" 
    rotation="-90 0 0"
    radius-inner="0.01"
    radius-outer="0.02"
  ></a-ring>

  <a-gltf-model
    id="box"
    src="model/arCar.glb"
    scale="40 40 40"
    position="0 0 0"
  >
  </a-gltf-model>  

</a-scene>

</body>
</html>
